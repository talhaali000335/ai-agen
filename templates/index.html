<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat – Groq</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; }
    .chat-container { max-width: 700px; margin: 30px auto; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
    .header { padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; }
    .message { margin-bottom: 15px; white-space: pre-wrap; }
    .message.user { text-align: right; color: #333; }
    .message.assistant { text-align: left; color: #111; }
    .message-content { display: inline-block; padding: 10px 14px; border-radius: 18px; max-width: 80%; }
    .user .message-content { background: #e0e7ff; }
    .assistant .message-content { background: #f1f1f1; }
    .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; }
    textarea { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; font-size: 16px; }
    button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-left: 10px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
    .typing-indicator { display: inline-block; margin-left: 10px; color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h3 style="margin:0;">Groq Chat</h3>
      <select id="model-select">
        {% for model in models %}
        <option value="{{ model }}">{{ model }}</option>
        {% endfor %}
      </select>
      <button onclick="startNewConversation()">New Chat</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <textarea id="user-input" placeholder="Type your message..." rows="2"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
  let conversationId = null;

  function startNewConversation() {
    conversationId = null;
    document.getElementById('messages').innerHTML = '';
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const message = input.value.trim();
    if (!message) return;

    const model = document.getElementById('model-select').value;
    const messagesDiv = document.getElementById('messages');

    // Add user message
    const userDiv = document.createElement('div');
    userDiv.className = 'message user';
    userDiv.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
    messagesDiv.appendChild(userDiv);
    input.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Add assistant placeholder
    const assistantDiv = document.createElement('div');
    assistantDiv.className = 'message assistant';
    const assistantContent = document.createElement('div');
    assistantContent.className = 'message-content';
    assistantDiv.appendChild(assistantContent);
    const typingIndicator = document.createElement('span');
    typingIndicator.className = 'typing-indicator';
    typingIndicator.textContent = '...';
    assistantDiv.appendChild(typingIndicator);
    messagesDiv.appendChild(assistantDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const payload = {
        message: message,
        model: model,
        conversation_id: conversationId,
      };

      const response = await fetch('/chat/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const err = await response.text();
        assistantContent.textContent = 'Error: ' + err;
        typingIndicator.remove();
        return;
      }

      const newConvId = response.headers.get('X-Conversation-ID');
      if (newConvId) conversationId = newConvId;

      // Remove typing indicator, keep the content div
      typingIndicator.remove();

      // Stream tokens
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let accumulated = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        accumulated += chunk;
        assistantContent.textContent = accumulated;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    } catch (e) {
      assistantContent.textContent = 'Error: ' + e.message;
      typingIndicator.remove();
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.getElementById('user-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
