<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Document Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    .header {
      background: #1e3a5f;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h2 { font-size: 20px; font-weight: 600; }
    .upload-section {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: #f9fafc;
      border-bottom: 1px solid #e5e7eb;
    }
    .upload-section input[type="file"] {
      flex: 1;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
    }
    .upload-btn {
      background: #eab308;
      color: #1e3a5f;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .upload-btn:hover { background: #d1a305; }
    .upload-status {
      padding: 4px 20px;
      font-size: 14px;
      color: #4b5563;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background: #1e3a5f;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      display: flex;
      padding: 12px 20px;
      border-top: 1px solid #e5e7eb;
      gap: 10px;
    }
    .input-area textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: none;
      font-size: 16px;
      font-family: inherit;
    }
    .input-area button {
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .input-area button:hover { background: #162a44; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #1e3a5f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>📄 RAG Document Chat</h2>
    </div>

    <div class="upload-section">
      <input type="file" id="file-input" accept=".pdf,.docx,.txt">
      <button class="upload-btn" onclick="uploadDocument()">Upload</button>
    </div>
    <div class="upload-status" id="upload-status"></div>

    <div class="chat-area" id="chat-area">
      <div class="message assistant">
        👋 Upload a PDF or DOCX, then ask me anything about it!
      </div>
    </div>

    <div class="input-area">
      <textarea id="user-input" rows="2" placeholder="Ask about your document..."></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function uploadDocument() {
      const fileInput = document.getElementById('file-input');
      const status = document.getElementById('upload-status');
      if (!fileInput.files.length) {
        status.textContent = 'Please select a file.';
        return;
      }
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      status.innerHTML = 'Uploading... <span class="spinner"></span>';
      try {
        const response = await fetch('/rag/upload/', {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        if (response.ok) {
          status.textContent = `✅ ${data.message || 'Uploaded successfully'}`;
          fileInput.value = '';
        } else {
          status.textContent = `❌ ${data.error || 'Upload failed'}`;
        }
      } catch (e) {
        status.textContent = `❌ ${e.message}`;
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      const chatArea = document.getElementById('chat-area');
      // Add user message
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.textContent = message;
      chatArea.appendChild(userDiv);

      // Add assistant placeholder with spinner
      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'message assistant';
      assistantDiv.innerHTML = 'Thinking... <span class="spinner"></span>';
      chatArea.appendChild(assistantDiv);

      input.value = '';
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        const response = await fetch('/rag/rag-chat/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message }),
        });
        const data = await response.json();
        assistantDiv.innerHTML = data.answer || data.error || 'No answer';
      } catch (e) {
        assistantDiv.innerHTML = 'Error: ' + e.message;
      }
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Allow Enter to send (Shift+Enter for newline)
    document.getElementById('user-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
