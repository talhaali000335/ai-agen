<!DOCTYPE html>
<html>
<head>
  <title>Voice Assistant</title>
  <style>
    body { font-family: sans-serif; background: #f4f7fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 600px; }
    h2 { text-align: center; }
    .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
    button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    #recordBtn { background: #e74c3c; color: white; }
    #stopBtn { background: #2ecc71; color: white; display: none; }
    #language { padding: 8px; border-radius: 6px; }
    .result { margin-top: 20px; }
    .transcript, .answer { background: #f9fafc; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    audio { width: 100%; margin-top: 10px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎙️ Voice Assistant</h2>
    <div style="text-align: center;">
      <label for="language">Language:</label>
      <select id="language">
        <option value="en">English</option>
        <option value="ur">Urdu</option>
      </select>
    </div>
    <div class="controls">
      <button id="recordBtn" onclick="startRecording()">Start Recording</button>
      <button id="stopBtn" onclick="stopRecording()">Stop &amp; Send</button>
    </div>
    <div id="status" style="text-align: center;"></div>
    <div class="result" id="result" style="display:none;">
      <div><strong>Transcript:</strong></div>
      <div class="transcript" id="transcript"></div>
      <div><strong>AI Answer:</strong></div>
      <div class="answer" id="answer"></div>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.start();
      document.getElementById('recordBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'inline-block';
      document.getElementById('status').textContent = 'Recording...';
    }

    async function stopRecording() {
      mediaRecorder.stop();
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        audioChunks = [];
        document.getElementById('status').innerHTML = '<span class="spinner"></span> Processing...';
        const formData = new FormData();
        formData.append('audio', audioBlob, 'recording.webm');
        formData.append('language', document.getElementById('language').value);
        try {
          const response = await fetch('/voice/process/', { method: 'POST', body: formData });
          const data = await response.json();
          if (response.ok) {
            document.getElementById('transcript').textContent = data.transcript;
            document.getElementById('answer').textContent = data.answer;
            document.getElementById('audioPlayer').src = data.audio_url;
            document.getElementById('result').style.display = 'block';
          } else {
            alert('Error: ' + (data.error || 'Unknown error'));
          }
        } catch (e) {
          alert('Error: ' + e.message);
        } finally {
          document.getElementById('recordBtn').style.display = 'inline-block';
          document.getElementById('stopBtn').style.display = 'none';
          document.getElementById('status').textContent = '';
        }
      };
    }
  </script>
</body>
</html>
